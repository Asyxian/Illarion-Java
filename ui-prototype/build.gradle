apply plugin: 'application'
apply from: '../versions.gradle'

application {
    mainClass = 'illarion.prototype.PrototypeMain'
}

dependencies {
    implementation project(':engine-libgdx')
    runtimeOnly "ch.qos.logback:logback-classic:${project.ext.logbackVersion}"
}

tasks.named('test', Test) {
    exclude '**/Scene2dNativeTest*'
}

tasks.register('nativeUiTest', Test) {
    description = 'Exercise the prototype on a real OpenGL context; requires a desktop.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include '**/Scene2dNativeTest*'
    jvmArgs rootProject.ext.applicationJvmArgs
}

tasks.named('run', JavaExec) {
    systemProperty 'illarion.prototype.settings', layout.buildDirectory.file('prototype/settings.properties').get()
}
