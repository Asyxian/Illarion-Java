apply plugin: 'application'
apply plugin: 'maven-publish'
apply from: '../versions.gradle'

['targetDistDir', 'install4jDir', 'install4jTargetDir', 'keyFile'].each { legacyProperty ->
    if (project.hasProperty(legacyProperty)) {
        throw new GradleException("${legacyProperty} belongs to the retired JavaFX/install4j release pipeline. " +
                'Use :download:packageLauncher; see README.md for release packaging limitations.')
    }
}

base {
    archivesName = 'illarion_download'
}

application {
    mainClass = 'illarion.download.Application'
}

def os = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def arch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def fxPlatform = os.contains('win') ? 'win' : os.contains('mac') ? 'mac' : 'linux'

if (arch in ['aarch64', 'arm64']) {
    fxPlatform += '-aarch64'
}

configurations {
    javafxModules {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }

    compileOnly.extendsFrom(javafxModules)
    testCompileOnly.extendsFrom(javafxModules)
}

def fxRootModules = 'javafx.controls,javafx.fxml'
def launcherJvmArgs = rootProject.ext.applicationJvmArgs.findAll {
    !it.startsWith('--enable-native-access=')
} + ['--enable-native-access=ALL-UNNAMED,javafx.graphics', "--add-modules=${fxRootModules}".toString()]

application {
    applicationDefaultJvmArgs = launcherJvmArgs
}

dependencies {
    api project(':common')
    api "org.slf4j:slf4j-api:${project.ext.slf4jVersion}"
    api "org.slf4j:jul-to-slf4j:${project.ext.slf4jVersion}"
    api "org.slf4j:jcl-over-slf4j:${project.ext.slf4jVersion}"
    api "org.slf4j:log4j-over-slf4j:${project.ext.slf4jVersion}"
    api "ch.qos.logback:logback-classic:${project.ext.logbackVersion}"
    api "org.ogce:xpp3:1.1.6"
    api "org.bushe:eventbus:1.4"
    api "com.google.guava:guava:21.0"
    api "org.eclipse.aether:aether-api:1.1.0"
    api "org.eclipse.aether:aether-connector-basic:1.1.0"
    api "org.eclipse.aether:aether-transport-http:1.1.0"
    api "org.apache.maven:maven-aether-provider:3.3.9"
}

dependencies {
    ['base', 'graphics', 'controls', 'fxml'].each { module ->
        javafxModules("org.openjfx:javafx-${module}:25.0.4:${fxPlatform}") {
            transitive = false
        }
    }
}

tasks.named('run', JavaExec) {
    inputs.files(configurations.javafxModules)
    jvmArgs = launcherJvmArgs

    doFirst {
        jvmArgs '--module-path', configurations.javafxModules.asPath
    }
}

tasks.withType(Test).configureEach {
    inputs.files(configurations.javafxModules)
    jvmArgs launcherJvmArgs

    doFirst {
        jvmArgs '--module-path', configurations.javafxModules.asPath
    }
}

distributions {
    main {
        contents {
            from(configurations.javafxModules) {
                into 'javafx'
            }
        }
    }
}

tasks.named('startScripts') {
    doLast {
        // Keep paths relative to the installed distribution, including paths containing spaces.
        [[windowsScript, '-classpath "%CLASSPATH%"', '--module-path "%APP_HOME%\\javafx" '],
         [unixScript, '-classpath "$CLASSPATH"', '--module-path "$APP_HOME/javafx" ']].each { script ->
            def content = script[0].getText('UTF-8')

            if (content.count(script[1]) != 1) {
                throw new GradleException("Cannot add the JavaFX module path to ${script[0].name}.")
            }

            script[0].setText(content.replace(script[1], script[2] + script[1]), 'UTF-8')
        }
    }
}

jar {
    dependsOn { gitVersion }
    manifest {
        attributes \
                 'Main-Class': 'illarion.download.Application', \
                 'JavaFX-Feature-Proxy': 'None', \
                 'Permissions': 'all-permissions', \
                 'Codebase': 'illarion.org', \
                 'Application-Name': 'Illarion Launcher', \
                 'Application-Library-Allowable-Codebase': 'illarion.org', \
                 'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ssZ'), \
                 'Built-By': System.getProperty('user.name'), \
                 'Built-JDK': System.getProperty('java.version'), \
                 'Implementation-Title': 'Illarion Launcher', \
                 'Implementation-Vendor': 'Illarion e.V.',\
                  'Implementation-Version': project.ext.fullVersion
    }
}

// Standard distributions replace the JDK-8-only JavaFX/Ant packaging plugin.
// jpackage creates a self-contained image on the host platform; it does not publish or install it.
tasks.register('packageLauncher', Exec) {
    dependsOn tasks.named('installDist')
    def destination = layout.buildDirectory.dir('package')
    def imageName = os.contains('mac') ? 'IllarionLauncher.app' : 'IllarionLauncher'

    inputs.dir(tasks.named('installDist').map {
        it.destinationDir
    })
    inputs.files(configurations.javafxModules)
    inputs.property('launcherJvmArgs', launcherJvmArgs)

    outputs.dir(destination.map {
        it.dir(imageName)
    })

    doFirst {
        delete destination.get().dir(imageName)

        def launcher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }.get()
        def executableName = os.contains('win') ? 'jpackage.exe' : 'jpackage'
        commandLine launcher.metadata.installationPath.file("bin/${executableName}").asFile,
            '--type', 'app-image', '--name', 'IllarionLauncher',
            '--input', new File(tasks.named('installDist').get().destinationDir, 'lib'),
            '--dest', destination.get().asFile,
            '--main-jar', tasks.named('jar', Jar).get().archiveFileName.get(),
            '--main-class', application.mainClass.get(),
            '--module-path', configurations.javafxModules.asPath,
            // Retain the full JDK module set for applications launched by this bundled runtime.
            '--add-modules', 'ALL-MODULE-PATH',
            '--java-options', launcherJvmArgs.join(' '),
            '--jlink-options', '--strip-debug --no-man-pages --no-header-files',
            '--vendor', 'Illarion e.V.'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = uri(project.ext.mavenRepo)
        }
    }
}
