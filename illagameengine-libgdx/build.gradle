apply plugin: 'java-library'
apply plugin: 'maven-publish'

base {
    archivesName = 'illarion_engine_libgdx'
}

dependencies {
    // Align Java bindings and every native classifier, including transitive libGDX dependencies.
    api platform('org.lwjgl:lwjgl-bom:3.4.3')
    api project(':engine')
    api "com.badlogicgames.gdx:gdx:1.13.1"
    api "com.badlogicgames.gdx:gdx-backend-lwjgl3:1.13.1"
    runtimeOnly "com.badlogicgames.gdx:gdx-platform:1.13.1:natives-desktop"
}

tasks.named('test', Test) {
    // Pixel-buffer lifecycle tests load libGDX natives without opening a graphics window.
    jvmArgs rootProject.ext.applicationJvmArgs

    useTestNG {
        excludeGroups 'nativeRuntime'
    }
}

// Requires a desktop with OpenGL; deliberately separate from the ordinary unit tests.
tasks.register('nativeRuntimeTest', Test) {
    description = 'Smoke-test libGDX and LWJGL with a hidden OpenGL window.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath

    useTestNG {
        includeGroups 'nativeRuntime'
    }

    jvmArgs rootProject.ext.applicationJvmArgs
}

jar {
    dependsOn { gitVersion }
    manifest {
        attributes          \
                 'Permissions': 'all-permissions',         \
                 'Codebase': 'illarion.org',         \
                 'Trusted-Library': true,         \
                 'Built-Date': new Date().format('yyyy-MM-dd HH:mm:ssZ'),         \
                 'Built-By': System.getProperty('user.name'),          \
                 'Built-JDK': System.getProperty('java.version'),          \
                 'Implementation-Title': 'Illarion Game Engine - libGDX Backend',          \
                 'Implementation-Vendor': 'Illarion e.V.',         \
                 'Implementation-Version': project.ext.fullVersion
    }
}

task sourceJar(type: Jar) {
    from sourceSets.main.allJava
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            artifact sourceJar {
                archiveClassifier = "sources"
            }
        }
    }
    repositories {
        maven {
            url = uri(project.ext.mavenRepo)
        }
    }
}
